mt5:
  login: 0                # điền số tài khoản MT5
  password: ""             # điền mật khẩu (nên dùng biến môi trường thay vì hardcode)
  server: ""               # tên server broker, vd "ICMarketsSC-Demo"
  terminal_path: ""        # đường dẫn terminal64.exe nếu cần chỉ định thủ công

symbol: "XAUUSD"
timeframe: "M5"

strategy:
  ema_fast: 50
  ema_slow: 100            # tuned via scripts/optimize.py on 2020-2023 train / validated on 2023-2025 test
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  rsi_pullback_level: 50   # ngưỡng RSI xác nhận hồi phục trong xu hướng tăng (100-level cho xu hướng giảm)
  atr_period: 14
  atr_sl_mult: 1.8         # tỷ lệ TP:SL = 5:3, kiểm chứng trên cả train/test - xem README "R:R ratio"
  atr_tp_mult: 3.0         # tighter trailing stop below usually exits before this TP anyway
  htf_timeframe: "M15"     # khung lớn hơn để xác nhận xu hướng, giảm nhiễu khung M5
  htf_ema_period: 100
  min_trend_strength_pct: 0.0256  # bỏ lệnh khi EMA fast/slow còn quá sát nhau (trend chưa rõ) - kiểm chứng trên cả train/test, xem README
  excluded_hours: [7, 9]   # 7h UTC = giờ mở cửa London hay whipsaw; 9h UTC trùng giờ ra tin EU/UK
                           # cả hai đều kiểm chứng độc lập trên train/test - xem README "loss post-mortem"

  # Confluence filters (kiểm chứng độc lập trên cả train 2020-2023 và test
  # 2023-2025 - profit factor và drawdown đều cải thiện ở cả hai giai đoạn,
  # xem README "Confluence filters"). Đổi lấy ít lệnh hơn.
  require_htf2_confirmation: true   # khung H1 phải cùng hướng xu hướng M5/M15
  htf2_timeframe: "H1"
  htf2_ema_period: 100
  require_atr_expansion: true       # ATR hiện tại phải cao hơn trung bình 20 nến gần nhất (biến động đang tăng)
  atr_expansion_period: 20

  # Regime switch: below adx_threshold the market is ranging, so the
  # trend-pullback rules above are disabled and mean-reversion rules below
  # take over instead. At/above threshold, trend-pullback rules apply.
  adx_period: 14
  adx_threshold: 20
  bb_period: 20
  bb_std_mult: 2.0
  mr_atr_sl_mult: 1.5
  mr_atr_tp_mult: 1.5
  enable_mean_reversion: false  # experimental - backtested net negative on real data, see README

sessions:                  # giờ UTC - vàng biến động mạnh nhất khi London/New York hoạt động
  - name: london
    start: "07:00"
    end: "11:00"
  - name: newyork
    start: "12:30"
    end: "16:00"

risk:
  risk_per_trade_pct: 2.0      # dùng cho percent_risk và fixed_capital_percent_risk
  max_trades_per_day: 4
  max_daily_loss_pct: 3.0      # dừng bot trong ngày nếu lỗ vượt mức này
  max_concurrent_trades: 1
  use_trailing_stop: true
  trailing_atr_mult: 1.0  # tuned: tighter trailing locks in profit sooner, improves both return and drawdown

  # Cách tính khối lượng lệnh (lot):
  #   fixed_capital_percent_risk -> (MẶC ĐỊNH, AN TOÀN) lot tính theo % của vốn GỐC CỐ
  #                   ĐỊNH (base_equity), KHÔNG bao giờ cộng dồn lãi/lỗ vào vốn tính lot.
  #                   Tự động co giãn theo khoảng cách SL (ATR) để rủi ro $ mỗi lệnh luôn
  #                   ổn định = risk_per_trade_pct% của base_equity, dù tài khoản đang lãi
  #                   hay lỗ. Đây là cách sửa lỗi "vốn ảo tăng lên rồi cháy tài khoản thật"
  #                   đã xảy ra khi test trên MT5 - xem README "Fixed-capital sizing".
  #   percent_risk -> giống trên nhưng lot co giãn theo equity ĐANG CÓ (live/compounding).
  #                   Lãi nhiều lot tự tăng, lỗ nhiều lot tự giảm - PHÙ HỢP nếu bạn chủ
  #                   động muốn compound lãi, nhưng đây chính là cơ chế đã làm vốn "ảo"
  #                   tăng lên rồi bị xóa sổ khi gặp chuỗi lệnh thua sau đó.
  #   equity_step  -> lot cố định theo mốc vốn: bắt đầu base_lot tại base_equity, cứ
  #                   lãi thêm equity_step_usd thì +lot_step, lỗ thì -lot_step (không
  #                   dưới min_lot). KHÔNG tự chuẩn hóa rủi ro theo SL, VÀ compound theo
  #                   lãi/lỗ - đây là mode đã gây cháy tài khoản thật trên MT5 (xem README).
  #                   Không khuyến nghị dùng nếu tài khoản nhỏ ($500-$1000).
  #   fixed_lot    -> lot cố định tuyệt đối (base_lot), không quan tâm equity hay SL.
  #                   Đơn giản nhất nhưng rủi ro $ mỗi lệnh KHÔNG được chuẩn hóa theo SL -
  #                   khi ATR giãn rộng, lệnh đó rủi ro nhiều $ hơn bình thường.
  #   dca_grid     -> (THỬ NGHIỆM, theo yêu cầu - không dùng qua run_backtest() thường,
  #                   phải gọi run_backtest_dca_grid()) giữ lệnh khi sideway, nhồi thêm
  #                   lệnh mỗi khi giá đi ngược dca_step_price, KHÔNG có SL/TP theo ATR -
  #                   chỉ thoát toàn bộ khi trend đảo chiều HOẶC lỗ tạm tính chạm
  #                   dca_hard_stop_pct (bắt buộc phải có, xem README "DCA/grid mode").
  #                   Rủi ro cao hơn hẳn các mode trên - đọc kỹ README trước khi dùng.
  sizing_mode: fixed_capital_percent_risk
  base_equity: 500.0
  base_lot: 0.02
  lot_step: 0.02
  equity_step_usd: 100.0
  min_lot: 0.02
  dca_step_price: 2.0
  dca_leg_risk_pct: 2.0
  dca_max_legs: 30
  dca_hard_stop_pct: 15.0

backtest:
  initial_balance: 500
  # Hồ sơ chi phí giao dịch. Mặc định dưới đây khớp tài khoản Exness Standard
  # (No commission, min deposit 10 USD, leverage 1:Unlimited).
  #
  # CẢNH BÁO: con số "min spread 0.20 pips" mà Exness quảng cáo là cho các cặp
  # FX chính (EURUSD...), KHÔNG phải cho XAUUSD, và "min" là mức tốt nhất chứ
  # không phải mức trung bình. Vàng trên tài khoản Standard thực tế rộng hơn
  # nhiều bậc và giãn mạnh khi ra tin. Dùng 0.20 pips cho vàng sẽ làm mọi kết
  # quả backtest đẹp lên một cách giả tạo - đúng cơ chế đã gây cháy tài khoản
  # thật trong project này. Kiểm tra số thật: MT5 > Market Watch > chuột phải
  # XAUUSD > Specification > Spread, xem cả lúc phiên yên và lúc ra tin.
  spread_points: 25        # 0.25 USD - mức thận trọng cho XAUUSD tài khoản Standard
  commission_per_lot: 0.0  # Exness Standard: không tính hoa hồng, chi phí nằm hết trong spread
  slippage_points: 5

logging:
  level: "INFO"
  file: "logs/gold_bot.log"
